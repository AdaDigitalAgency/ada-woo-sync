name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-go@v6.4.0
        with:
          go-version: '1.26'

      - name: Build binaries
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          LDFLAGS="-s -w -X main.version=${VERSION}"

          # Linux amd64 (primary target — servers)
          GOOS=linux GOARCH=amd64 go build -ldflags "${LDFLAGS}" -o wp-sync_linux_amd64 ./cmd/wp-sync/
          
          # Linux arm64
          GOOS=linux GOARCH=arm64 go build -ldflags "${LDFLAGS}" -o wp-sync_linux_arm64 ./cmd/wp-sync/

      - name: Generate checksums
        run: sha256sum wp-sync_* > checksums.txt

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            wp-sync_linux_amd64
            wp-sync_linux_arm64
            checksums.txt
